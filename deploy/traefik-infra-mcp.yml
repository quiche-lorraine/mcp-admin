# Configuration dynamique Traefik, à ajouter dans ton proxy (ex. avec Coolify :
# Serveur → Proxy → Dynamic Configurations). Adapte le domaine, ainsi que le
# certResolver et l'entrypoint s'ils portent d'autres noms chez toi.
http:
  routers:
    infra-mcp:
      rule: "Host(`mcp.example.fr`)"
      entryPoints: [https]
      service: infra-mcp
      tls:
        certResolver: letsencrypt
      # Défense en profondeur optionnelle : n'accepter que certaines IP.
      # middlewares: [infra-mcp-ips]
  # middlewares:
  #   infra-mcp-ips:
  #     ipAllowList:
  #       sourceRange: ["198.51.100.0/24"]
  services:
    infra-mcp:
      loadBalancer:
        servers:
          - url: "http://10.0.1.1:8765"
