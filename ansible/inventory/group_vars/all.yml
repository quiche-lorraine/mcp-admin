# Couche globale.
#
# Règle de propagation des listes : chaque couche définit sa propre variable,
# suffixée par son nom (_global, _<groupe>, _host). Le rôle base additionne
# toutes les variables qui commencent par le même préfixe. Une couche inférieure
# ajoute donc à la liste au lieu de la remplacer.
#
# Les valeurs simples (non-listes) suivent la priorité Ansible classique :
# l'hôte gagne sur le groupe, qui gagne sur le global, qui gagne sur les valeurs
# par défaut du socle. Le socle verrouille certaines valeurs (firewall en deny) ;
# locked_vars permet d'en verrouiller d'autres.

# Le socle (infra_mcp.core.base) fournit déjà : ca-certificates, curl,
# unattended-upgrades, SSH ouvert, entrée en deny (verrouillée), telnet retiré.
# Ces listes s'y ajoutent.

ansible_user: renaud

packages_present_global:
  - htop

firewall_allow_global:
  - { port: "80", proto: tcp }
  - { port: "443", proto: tcp }

admin_users_global:
  - name: renaud
    sudo: true
    ssh_keys:
      - "ssh-ed25519 AAAA...remplace-moi renaud@poste"
      # Clé du contrôleur infra-mcp. Indispensable : authorized_key est en mode
      # exclusif, une clé absente de cette liste est retirée des serveurs.
      - "ssh-ed25519 AAAA...remplace-moi infra-mcp@controleur"

# Retirer une entrée des listes ci-dessus ne défait rien sur les serveurs : le
# port reste ouvert, le compte existe toujours. Pour retirer, liste l'élément ici
# (ou dans firewall_remove_<groupe> / users_absent_host…). Le port SSH, root et
# ansible_user sont protégés : le rôle base refuse de les retirer.
firewall_remove_global: []
#  - { port: "8080", proto: tcp }   # même src que la règle d'origine, s'il y en a une
users_absent_global: []
#  - ancien-admin                   # compte supprimé, dossier personnel conservé

# Heure de redémarrage si une mise à jour l'exige. Décalée pour les workers du
# swarm (group_vars/swarm_workers.yml) et pour srv-01 (host_vars) afin que tout
# le parc ne tombe pas ensemble.
updates_reboot_time: "04:00"
