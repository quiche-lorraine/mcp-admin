- name: Fusion des couches et garde-fous
  ansible.builtin.import_tasks: checks.yml

# --- Paquets -----------------------------------------------------------------

- name: Paquets présents
  ansible.builtin.apt:
    name: "{{ base_packages_present }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Paquets absents
  ansible.builtin.apt:
    name: "{{ base_packages_absent }}"
    state: absent
  when: base_packages_absent | length > 0

# --- Mises à jour de sécurité automatiques -------------------------------------

- name: Configure unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52infra
    mode: "0644"
    content: |
      // Géré par Ansible (rôle base) — ne pas modifier à la main.
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Automatic-Reboot "{{ updates_auto_reboot | bool | lower }}";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ updates_reboot_time }}";

# --- Utilisateurs admin --------------------------------------------------------

- name: Utilisateurs admin
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /bin/bash
    create_home: true
  loop: "{{ base_admin_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Clés SSH des admins (exclusives : les clés hors config sont retirées)"
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_keys | join('\n') }}"
    exclusive: true
  loop: "{{ base_admin_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Sudo pour les admins concernés
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ item.name }}"
    mode: "0440"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    validate: "visudo -cf %s"
  loop: "{{ base_admin_users | selectattr('sudo', 'defined') | selectattr('sudo') | list }}"
  loop_control:
    label: "{{ item.name }}"

# Retirer un compte de admin_users_* ne le supprime pas : il faut le lister dans
# users_absent_*. Le dossier personnel est conservé. La suppression échoue si le
# compte a encore des processus en cours (session ouverte, cron…).
- name: Sudo des comptes retirés
  ansible.builtin.file:
    path: "/etc/sudoers.d/90-{{ item }}"
    state: absent
  loop: "{{ base_users_absent }}"

- name: Comptes retirés
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: false
  loop: "{{ base_users_absent }}"

# --- Firewall -----------------------------------------------------------------
# Ordre important : les règles d'autorisation (SSH compris) AVANT d'activer ufw,
# sinon on se coupe l'accès.

- name: Paquet ufw installé
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Règles d'autorisation
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ item.src | default(omit) }}"
  loop: "{{ base_firewall_allow }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"

# Retirer une entrée de firewall_allow_* ne ferme pas le port : il faut la
# lister dans firewall_remove_*, avec la même source (src) que la règle d'origine.
- name: Règles retirées
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ item.src | default(omit) }}"
    delete: true
  loop: "{{ base_firewall_remove }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"

- name: Politique entrante par défaut et activation
  community.general.ufw:
    state: enabled
    direction: incoming
    default: "{{ firewall_default_incoming }}"
