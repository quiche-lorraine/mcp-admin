name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      # Comprend le garde-fou qui interdit check_mode: false et le lookup pipe
      # dans le repo Ansible (tests/test_ansible_policy.py).
      - run: pytest -v

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # L'outil installe la collection infra_mcp.core, ses dépendances (paquet
      # ansible complet) et la commande lint, comme sur le contrôleur.
      - run: pip install -e . ansible-lint
      - name: Collection infra_mcp.core
        working-directory: src/ansible_collections/infra_mcp/core
        run: ansible-lint
      - name: Repo de config (ansible/)
        working-directory: ansible
        run: |
          infra-mcp lint .
          ansible-playbook --syntax-check playbooks/*.yml
          ansible-lint

  # Bout en bout sur un vrai swarm à un nœud : plan, apply, rotation de secret,
  # suppression (tests/test_stacks_e2e.py, sauté ailleurs faute de swarm).
  stacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]' docker jsondiff
      - run: docker swarm init --advertise-addr 127.0.0.1
      - run: pytest -v tests/test_stacks_e2e.py
