# --- Utilisateurs admin --------------------------------------------------------

- name: Utilisateurs admin
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /bin/bash
    create_home: true
  loop: "{{ base_admin_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Clés SSH des admins (exclusives : les clés hors config sont retirées)"
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_keys | join('\n') }}"
    exclusive: true
  loop: "{{ base_admin_users }}"
  loop_control:
    label: "{{ item.name }}"

# Les fichiers sudo créés par ce rôle portent un marqueur : tout fichier marqué
# qui ne correspond plus à un admin avec sudo: true est supprimé. Les fichiers
# posés par d'autres outils (ex. 90-cloud-init-users) ne sont jamais touchés.
- name: Sudo pour les admins concernés
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ item.name }}"
    mode: "0440"
    content: |
      # ansible-managed: role base
      {{ item.name }} ALL=(ALL) NOPASSWD:ALL
    validate: "visudo -cf %s"
  loop: "{{ base_admin_users | selectattr('sudo', 'defined') | selectattr('sudo') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Fichiers sudo gérés par ce rôle
  ansible.builtin.find:
    paths: /etc/sudoers.d
    patterns: "90-*"
    contains: "^# ansible-managed: role base$"
  register: base_sudoers_found

- name: Sudo retiré aux comptes qui n'y ont plus droit
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ base_sudoers_found.files | map(attribute='path') | difference(_expected) | sort }}"
  vars:
    _expected: >-
      {{ base_admin_users | selectattr('sudo', 'defined') | selectattr('sudo')
         | map(attribute='name') | map('regex_replace', '^', '/etc/sudoers.d/90-') }}
