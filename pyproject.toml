[project]
name = "infra-mcp"
version = "0.1.0"
description = "Serveur MCP qui pilote un repo Ansible : lecture, plan (check mode) et apply contrôlé"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1,<5",
    "ansible-core>=2.20",
]

[project.scripts]
infra-mcp = "infra_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
