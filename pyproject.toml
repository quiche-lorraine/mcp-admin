[project]
name = "infra-mcp"
version = "0.1.0"
description = "Serveur MCP qui pilote un repo Ansible : lecture, plan (check mode) et apply contrôlé"
requires-python = ">=3.12"  # ansible-core 2.20+ exige Python 3.12
dependencies = [
    "fastmcp>=4.1,<5",
    # Paquet ansible complet : ansible-core 2.20+ et les collections dont dépend
    # le socle (community.general, community.docker, ansible.posix).
    "ansible>=13,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
infra-mcp = "infra_mcp.cli:main"

[tool.hatch.build.targets.wheel]
# La collection Ansible est livrée avec l'outil, au niveau racine du paquet
# installé : Ansible la trouve dans le sys.path du venv, sans configuration.
packages = ["src/infra_mcp", "src/ansible_collections"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
