[project]
name = "infra-mcp"
version = "0.1.0"
description = "Serveur MCP qui pilote un repo Ansible : lecture, plan (check mode) et apply contrôlé"
requires-python = ">=3.12"  # ansible-core 2.20+ exige Python 3.12
dependencies = [
    "fastmcp>=4.1,<5",
    "ansible-core>=2.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
infra-mcp = "infra_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
